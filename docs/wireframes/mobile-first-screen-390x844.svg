<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">成田空港アクセス状況 390×844px モバイルファースト画面</title>
  <desc id="desc">ヘッダー、地図、交通サマリー、次の行動をスクロールせず確認できる実寸ワイヤーフレーム</desc>
  <defs>
    <pattern id="map-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#cbd6de" stroke-width="1"/>
    </pattern>
    <style>
      .ui { font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #17212d; }
      .label { font-size: 10px; font-weight: 800; letter-spacing: .04em; }
      .small { font-size: 9px; font-weight: 650; }
      .body { font-size: 12px; font-weight: 750; }
      .heading { font-size: 15px; font-weight: 850; }
      .frame { fill: #fff; stroke: #9ba8b3; }
    </style>
  </defs>

  <rect width="390" height="844" fill="#e8edf1"/>

  <!-- 0–72: compact identity and controls -->
  <g class="ui">
    <rect x="0" y="0" width="390" height="72" fill="#fff"/>
    <rect x="0" y="69" width="390" height="3" fill="#005ea8"/>
    <rect x="12" y="12" width="40" height="40" rx="2" fill="#003f73"/>
    <text x="32" y="37" text-anchor="middle" fill="#fff" class="label">NRT</text>
    <text x="62" y="28" class="heading">成田空港アクセス状況</text>
    <text x="62" y="46" class="small" fill="#52606c">鉄道・バス・道路・空港</text>
    <rect x="304" y="12" width="74" height="40" rx="2" class="frame"/>
    <text x="341" y="29" text-anchor="middle" class="small">日本語⌄</text>
    <text x="341" y="43" text-anchor="middle" class="small" fill="#19733b">● 09:52</text>
  </g>

  <!-- 76–344: map as the primary spatial answer -->
  <g class="ui">
    <rect x="8" y="76" width="374" height="268" rx="2" fill="#edf4f8" stroke="#9ba8b3"/>
    <rect x="9" y="77" width="372" height="266" fill="url(#map-grid)"/>
    <path d="M 18 309 C 88 272, 124 256, 183 217 S 285 170, 370 119" fill="none" stroke="#b9000f" stroke-width="5"/>
    <path d="M 18 283 C 92 254, 150 222, 205 192 S 294 156, 370 138" fill="none" stroke="#d89000" stroke-width="5"/>
    <path d="M 48 322 C 104 286, 158 263, 209 222 S 303 171, 368 160" fill="none" stroke="#19733b" stroke-width="5"/>
    <circle cx="292" cy="168" r="10" fill="#003f73" stroke="#fff" stroke-width="4"/>
    <text x="307" y="171" class="label">NRT</text>
    <rect x="18" y="88" width="108" height="38" rx="2" fill="#fff" stroke="#8fa3b4"/>
    <text x="28" y="104" class="small">☂ 気象・大雨情報</text>
    <text x="28" y="118" class="small" fill="#52606c">レイヤー表示中</text>
    <rect x="282" y="88" width="88" height="38" rx="2" fill="#fff" stroke="#8fa3b4"/>
    <text x="326" y="104" text-anchor="middle" class="small">データ更新</text>
    <text x="326" y="118" text-anchor="middle" class="small" fill="#19733b">08/15 09:52</text>
    <rect x="18" y="294" width="190" height="36" rx="2" fill="#fff" stroke="#9ba8b3"/>
    <text x="28" y="316" class="small">━ 見合わせ  ━ 遅延  ━ 正常</text>
    <rect x="300" y="288" width="70" height="42" rx="2" fill="#17212d"/>
    <text x="335" y="313" text-anchor="middle" fill="#fff" class="small">地図の事象 8</text>
  </g>

  <!-- 352–650: five transport categories, readable at a glance -->
  <g class="ui">
    <rect x="8" y="352" width="374" height="298" rx="2" class="frame"/>
    <rect x="8" y="352" width="374" height="44" fill="#003f73"/>
    <text x="20" y="379" fill="#fff" class="heading">いまの交通状況</text>
    <text x="368" y="379" text-anchor="end" fill="#d8ebf8" class="small">1件の注意情報</text>

    <g transform="translate(16 404)">
      <rect width="358" height="44" fill="#fff7db" stroke="#d8c26f"/>
      <rect width="5" height="44" fill="#d89000"/>
      <text x="16" y="18" class="body">JR成田線</text><text x="342" y="27" text-anchor="end" class="label" fill="#6a4700">遅延・規制</text>
      <text x="16" y="33" class="small" fill="#52606c">公式情報 09:52</text>
    </g>
    <g transform="translate(16 452)">
      <rect width="358" height="44" fill="#fff" stroke="#c2cbd2"/>
      <rect width="5" height="44" fill="#7b3c94"/>
      <text x="16" y="27" class="body">京成線</text><text x="342" y="27" text-anchor="end" class="label" fill="#005ea8">公式情報 ↗</text>
    </g>
    <g transform="translate(16 500)">
      <rect width="358" height="44" fill="#fff" stroke="#c2cbd2"/>
      <rect width="5" height="44" fill="#2f7f9a"/>
      <text x="16" y="27" class="body">北総線</text><text x="342" y="27" text-anchor="end" class="label" fill="#005ea8">公式情報 ↗</text>
    </g>
    <g transform="translate(16 548)">
      <rect width="358" height="44" fill="#fff" stroke="#c2cbd2"/>
      <rect width="5" height="44" fill="#a47a13"/>
      <text x="16" y="27" class="body">空港バス</text><text x="342" y="27" text-anchor="end" class="label" fill="#005ea8">公式情報 ↗</text>
    </g>
    <g transform="translate(16 596)">
      <rect width="358" height="44" fill="#fff" stroke="#c2cbd2"/>
      <rect width="5" height="44" fill="#6c737a"/>
      <text x="16" y="27" class="body">高速・一般道</text><text x="342" y="27" text-anchor="end" class="label" fill="#005ea8">公式情報 ↗</text>
    </g>
  </g>

  <!-- 658–830: the next action is visible without scrolling -->
  <g class="ui">
    <rect x="8" y="658" width="374" height="172" rx="2" class="frame"/>
    <text x="20" y="688" class="heading">次にすること</text>
    <text x="370" y="686" text-anchor="end" class="small" fill="#52606c">状況を選ぶ</text>
    <g transform="translate(16 704)">
      <rect width="112" height="72" rx="2" fill="#003f73"/>
      <text x="56" y="29" text-anchor="middle" fill="#9fd5f5" class="label">NRT →</text>
      <text x="56" y="51" text-anchor="middle" fill="#fff" class="body">空港から出たい</text>
    </g>
    <g transform="translate(139 704)">
      <rect width="112" height="72" rx="2" fill="#fff" stroke="#77838d" stroke-width="2"/>
      <text x="56" y="29" text-anchor="middle" fill="#005ea8" class="label">→ NRT</text>
      <text x="56" y="51" text-anchor="middle" class="body">空港へ向かう</text>
    </g>
    <g transform="translate(262 704)">
      <rect width="112" height="72" rx="2" fill="#e8f3fb" stroke="#005ea8" stroke-width="2"/>
      <text x="56" y="29" text-anchor="middle" fill="#005ea8" class="label">STAY / INFO</text>
      <text x="56" y="51" text-anchor="middle" class="body">移動できないとき</text>
    </g>
    <text x="20" y="812" class="small" fill="#52606c">詳細、注意情報、支援情報はこの下に続く</text>
  </g>

  <line x1="0" y1="843" x2="390" y2="843" stroke="#b9000f" stroke-dasharray="5 4"/>
</svg>
